# The datasets the tutorial notebooks read (H-0137, #385).
#
# Every file in this directory except this manifest is listed here, with the
# sha256 of its bytes; tests/test_notebooks/test_notebook_data.py checks both.
# scripts/vendor_notebook_data.py rebuilds the files from the sources below and
# checks that each tutorial's prepared frame equals the one built from the
# online source. It needs the network, so CI does not run it.
#
# Each file is a gzip-compressed CSV (gzip mtime 0, level 9), read with
# pandas.read_csv.

[[dataset]]
file = "credit-g.csv.gz"
sha256 = "584993877329142e1150e2c142888cfa16f653fab34b77d63c10ae82774c5a17"
notebooks = ["tutorial_binary_lgbm.ipynb"]
title = "Statlog (German Credit Data)"
creator = "Hans Hofmann"
source = "OpenML dataset 31 (credit-g, version 1), https://www.openml.org/d/31"
origin = "UCI Machine Learning Repository, https://archive.ics.uci.edu/dataset/144/statlog+german+credit+data"
licence = "CC BY 4.0"
retrieved = "2026-10-21"
derivation = "sklearn.datasets.fetch_openml('credit-g', version=1, as_frame=True, parser='auto').frame, written unchanged (1000 rows, 21 columns; the target column is 'class')"

