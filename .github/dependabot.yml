version: 2
# H-0146: version updates go to develop and wait 7 days after a release.
# Dependabot reads this file from the default branch (main), so a change takes
# effect after the release that carries it. Security updates always target
# main, whatever target-branch says.
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: develop
    # The pyproject.toml floors are a maintainer decision (H-0126); only the
    # lock moves.
    versioning-strategy: lockfile-only
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
