name: artifact-language

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  issues:
    types: [opened, edited, reopened]
  # H-0146: read-only token, the default branch's code, and only the event
  # payload is read; nothing from the commenter is executed.
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created, edited]
  push:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate selected artifact boundary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            bash tests/test-artifact-language.sh
          else
            python3 .githooks/artifact-language.py github-event \
              --event-name "$GITHUB_EVENT_NAME" \
              --event-path "$GITHUB_EVENT_PATH"
          fi
