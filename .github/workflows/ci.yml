name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  git-policy:
    name: Owned Git policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Activate tracked hooks
        run: git config core.hooksPath .githooks
      - name: Verify owned hook routing and controls
        run: bash tests/test-owned-githooks-policy.sh

  quality:
    name: Quality (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Verify Ruff policy boundary mutations
        run: bash tests/test-ruff-policy-boundary.sh

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy lizyml/

      - name: Test (pytest)
        # cov-fail-under=96 is branch-inclusive (branch=true, #173): the
        # not-slow develop lane measures ~97% with branches counted, so 96 is a
        # realistic floor with a 1-point buffer. The main lane (full suite)
        # measures higher, so the same floor holds there.
        run: |
          if [ "${{ github.base_ref }}" = "main" ]; then
            uv run pytest tests/ -m "" --cov=lizyml --cov-report=term-missing --cov-fail-under=96 -q
          else
            uv run pytest tests/ -m "not slow" --cov=lizyml --cov-report=term-missing --cov-fail-under=96 -q
          fi

  quality-lowest-deps:
    name: Quality (lowest-direct deps)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"

      - name: Install lowest direct dependencies
        run: uv sync --frozen --dev --resolution lowest-direct

      - name: Test (pytest)
        run: uv run pytest tests/ -q

  quality-latest-deps:
    name: Quality (latest deps, non-blocking)
    runs-on: ubuntu-latest
    # Forward-compat early-warning lane (#180): resolves dependencies upward to
    # the newest compatible releases so an upstream breaking change (pandas /
    # numpy / lightgbm) surfaces here before it reaches the locked lanes.
    # Non-blocking — it must not gate merges on third-party regressions.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install latest dependencies
        run: uv sync --upgrade --dev

      - name: Test (pytest)
        run: uv run pytest tests/ -m "not slow" -q

  smoke-os-matrix:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # OS portability smoke (#180): file I/O, path, and newline handling on
    # non-Linux runners. Scoped to persistence + a minimal end-to-end
    # round-trip (single Python) to keep the matrix fast.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install OpenMP runtime (macOS — required by lightgbm)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Portability smoke (persistence + README round-trip)
        run: uv run pytest tests/test_persistence tests/test_e2e/test_readme_example.py -m "not slow" -q

  distribution:
    name: Distribution check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: uv sync --frozen --dev

      - name: Build sdist and wheel
        run: uv build

      - name: Check distribution
        run: uv run twine check dist/*

      - name: Smoke test installation from wheel
        run: |
          pip install dist/*.whl --quiet
          python -c "from lizyml import Model; print('import ok:', Model)"

  # --- Notebook index contract (H-0119 6.) -------------------------------------
  # Trigger rule (decision 1, 2026-10-10): the jobs below run on every PR and
  # every push to main; nothing selects them by changed paths. The
  # notebook-index-gate job at the end passes only when the matrix job and both
  # index jobs succeeded, and is the one check to require.
  notebook-index-matrix:
    name: Notebook index (matrix)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the notebooks and extras to test
        id: matrix
        # Standard library only: runs before anything is installed.
        run: |
          matrix=$(python3 scripts/examples_index.py --ci-matrix)
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  extras-registry:
    # 6.(a): every row of lizyml/_extras.py raises OPTIONAL_DEP_MISSING, naming
    # the extra's package, in an environment without that extra.
    name: Extras registry (without ${{ matrix.removed }})
    needs: notebook-index-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        removed: ${{ fromJSON(needs.notebook-index-matrix.outputs.matrix).removed }}
    env:
      REMOVED: ${{ matrix.removed }}

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install every extra but the removed one
        run: |
          flags=$(python3 scripts/examples_index.py --uv-flags-without "$REMOVED")
          uv sync --frozen --no-dev --group notebooks $flags

      - name: Call every registry row that needs the removed extra
        run: uv run --no-sync --no-dev python -m tests.test_notebooks.probe_extras_registry --without "$REMOVED"

  notebook-index-execution:
    # 6.(b): each notebook runs with only the extras it declares, and every
    # index-example statement is recorded as run on the declared Model.
    name: Notebook index (${{ matrix.notebook }})
    needs: notebook-index-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        notebook: ${{ fromJSON(needs.notebook-index-matrix.outputs.matrix).notebook }}
    env:
      NOTEBOOK: ${{ matrix.notebook }}

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install the declared extras only
        run: |
          flags=$(python3 scripts/examples_index.py --uv-flags-for "$NOTEBOOK")
          echo "extras: ${flags:-none}"
          uv sync --frozen --no-dev --group notebooks $flags

      - name: Check that exactly the declared extras are installed
        run: uv run --no-sync --no-dev python -m tests.test_notebooks.check_installed_extras "$NOTEBOOK"

      - name: Execute the notebook and record its index examples
        run: uv run --no-sync --no-dev python -m pytest tests/test_notebooks/test_index_execution.py -m slow -k "$NOTEBOOK"

  notebook-index-gate:
    # The single check to require for the notebook index (H-0119 6.). It always
    # runs and passes only when the matrix job and both index jobs succeeded; a
    # failed, cancelled or skipped job fails it. The decision is
    # scripts/notebook_index_gate.py (unit-tested).
    name: Notebook index (gate)
    needs: [notebook-index-matrix, extras-registry, notebook-index-execution]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Decide from the index job results
        env:
          MATRIX_RESULT: ${{ needs.notebook-index-matrix.result }}
          REGISTRY_RESULT: ${{ needs.extras-registry.result }}
          EXECUTION_RESULT: ${{ needs.notebook-index-execution.result }}
        run: python3 scripts/notebook_index_gate.py
