name: Auto-tag and GitHub Release

# Triggered when a PR with title starting "release:" is merged into main.
# Creates a git tag and a GitHub Release with notes from CHANGELOG.md.
# Then triggers release.yml (PyPI publish) via workflow_dispatch.
#
# Note: GITHUB_TOKEN-created release events do NOT trigger other workflows
# (GitHub's infinite loop prevention). workflow_dispatch is the official
# exception — explicitly supported since Sep 2022.
# See: https://github.blog/changelog/2022-09-08-github-actions-use-github_token-with-workflow_dispatch-and-repository_dispatch/

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  actions: write  # Required to trigger release.yml via workflow_dispatch

jobs:
  tag-and-release:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.title, 'release:')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # H-0117: only a two-parent merge of develop into main is a release.
      - name: Verify the release is a merge commit of develop
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: bash .github/scripts/check_release_merge.sh

      - name: Extract version from PR title
        id: version
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: bash .github/scripts/release_version.sh

      - name: Extract release notes from CHANGELOG.md
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Extract the section for this version (between ## [X.Y.Z] and the next ## [)
          NOTES=$(awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release ${VERSION}"
          fi
          # Write to file for gh release create --notes-file
          echo "$NOTES" > /tmp/release-notes.md
          echo "Release notes extracted:"
          cat /tmp/release-notes.md

      # Idempotent: a re-run after a later step failed reuses a tag that already
      # names the merge commit, and refuses one that names anything else.
      - name: Create tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: bash .github/scripts/create_release_tag.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; reusing it"
          else
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/release-notes.md
          fi

      - name: Trigger PyPI publish workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run release.yml -f tag="$TAG"
